name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write # commit the new image tag into k8s/app.yaml
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

      # Apply schema changes before the new image is deployed. Additive changes only:
      # anything needing a data-loss prompt fails here and blocks the deploy.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Push DB schema
        timeout-minutes: 5
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/db run push < /dev/null
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ArgoCD deploys what is in k8s/, so pin the manifest to the image just built.
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this does not loop.
      - name: Bump image tag in k8s manifest
        run: |
          sed -i -E "s|(image: ghcr.io/${GITHUB_REPOSITORY,,}):.*|\1:${GITHUB_SHA}|" k8s/app.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
