# Applied once by hand: kubectl apply -f k8s/argocd/application.yaml
# Lives in a subfolder so ArgoCD (path: k8s, non-recursive) does not manage itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tinygoods
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ArturSkrin/tiny_goods.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: tinygoods
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
