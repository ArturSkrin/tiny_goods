openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TinyGoods UA store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Product categories
  - name: products
    description: Products
  - name: orders
    description: Orders
  - name: admin
    description: Admin analytics
  - name: account
    description: Buyer account
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories with product counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: featured
          in: query
          required: false
          schema: { type: boolean }
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/payment-status:
    get:
      operationId: getOrderPaymentStatus
      tags: [orders]
      summary: Get payment status for a customer order by token (no PII returned)
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPaymentStatus"
        "404":
          description: Order not found
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order with items (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}/liqpay-checkout:
    post:
      operationId: createLiqpayCheckout
      tags: [orders]
      summary: Generate LiqPay checkout form params for an order (paymentMethod must be liqpay)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: LiqPay checkout data and signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiqpayCheckout"
        "404":
          description: Order not found
        "503":
          description: LiqPay not configured
  /liqpay/webhook:
    post:
      operationId: liqpayWebhook
      tags: [orders]
      summary: LiqPay payment status webhook
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LiqpayWebhookPayload"
      responses:
        "200":
          description: OK
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Current admin session state
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/setup:
    post:
      operationId: setupAdmin
      tags: [admin]
      summary: Set initial admin password (only when not configured)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "200":
          description: Configured and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Already configured
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login with password and optional TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Log out admin
      responses:
        "204":
          description: Logged out
  /admin/2fa/setup:
    post:
      operationId: totpSetup
      tags: [admin]
      summary: Generate TOTP secret and otpauth URL (requires session)
      responses:
        "200":
          description: TOTP setup data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
  /admin/2fa/enable:
    post:
      operationId: totpEnable
      tags: [admin]
      summary: Enable 2FA by confirming a TOTP code (requires session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid code
  /admin/2fa/disable:
    post:
      operationId: totpDisable
      tags: [admin]
      summary: Disable 2FA by confirming a TOTP code (requires session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid code
  /admin/password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change admin password (requires session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Changed
        "401":
          description: Wrong current password
  /settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: Public storefront settings (texts, contacts, amounts)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSettings
      tags: [admin]
      summary: Replace storefront settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /images:
    post:
      operationId: uploadImage
      tags: [admin]
      summary: Upload an image (base64 data URL); served at the returned url
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
  /np/cities:
    get:
      operationId: searchNpCities
      tags: [orders]
      summary: Nova Poshta cities (major regional centres when q is empty)
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Cities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NpCity" }
  /np/warehouses:
    get:
      operationId: searchNpWarehouses
      tags: [orders]
      summary: Nova Poshta branches and parcel lockers of a city
      parameters:
        - name: cityRef
          in: query
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NpWarehouse" }
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [account]
      summary: Which sign-in methods are configured
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /auth/email/start:
    post:
      operationId: startEmailLogin
      tags: [account]
      summary: Email a one-time sign-in code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailLoginStart" }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
  /auth/email/verify:
    post:
      operationId: verifyEmailLogin
      tags: [account]
      summary: Sign in with the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailLoginVerify" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /auth/telegram:
    post:
      operationId: telegramLogin
      tags: [account]
      summary: Sign in with data from the Telegram Login Widget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramAuthInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /auth/logout:
    post:
      operationId: customerLogout
      tags: [account]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Current buyer (customer is null when signed out)
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
    patch:
      operationId: updateMe
      tags: [account]
      summary: Update contact details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
    delete:
      operationId: deleteMe
      tags: [account]
      summary: Delete the account (orders are kept without the link)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
  /me/addresses:
    get:
      operationId: listMyAddresses
      tags: [account]
      summary: Saved delivery addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Address" }
    post:
      operationId: addMyAddress
      tags: [account]
      summary: Save a delivery address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
  /me/addresses/{id}:
    patch:
      operationId: setMyDefaultAddress
      tags: [account]
      summary: Make an address the default
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
    delete:
      operationId: deleteMyAddress
      tags: [account]
      summary: Remove an address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
  /me/orders:
    get:
      operationId: listMyOrders
      tags: [account]
      summary: Order history
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /me/viewed:
    get:
      operationId: listMyViewed
      tags: [account]
      summary: Recently viewed products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: addMyViewed
      tags: [account]
      summary: Merge viewed product ids (newest first) into the history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewedInput" }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard stats for admin
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, sortOrder, productCount]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer }
        productCount: { type: integer }
        imageUrl: { type: ["string", "null"] }
        tagline: { type: ["string", "null"], description: "Small label on the home page showcase card" }
        coverUrl: { type: ["string", "null"], description: "imageUrl, or a product photo from this category when none is set" }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }
        tagline: { type: ["string", "null"] }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        sortOrder: { type: integer }
        imageUrl: { type: ["string", "null"] }
        tagline: { type: ["string", "null"] }
    ProductOption:
      type: object
      required: [name, priceDelta]
      properties:
        name: { type: string, minLength: 1 }
        priceDelta: { type: number, description: "Added to the base price (UAH), may be 0 or negative" }
        hex: { type: ["string", "null"], description: "Swatch colour for colour options" }
        imageUrl: { type: ["string", "null"], description: "Photo of the product in this colour" }
    Product:
      type: object
      required: [id, categoryId, name, price, stock, isActive, isFeatured, sizes, colors, sizeOrder, createdAt]
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        sku: { type: ["string", "null"] }
        price: { type: number }
        oldPrice: { type: ["number", "null"] }
        imageUrl: { type: ["string", "null"] }
        stock: { type: integer }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        sizes:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        colors:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        sizeOrder: { $ref: "#/components/schemas/SizeOrder" }
        createdAt: { type: string }
    SizeOrder:
      type: string
      enum: [whd, hwd, wdh]
      description: "Meaning of the numbers in a size name: w=width, h=height, d=depth (e.g. wdh = length × width × height of a box)"
    ProductInput:
      type: object
      required: [categoryId, name, price]
      properties:
        categoryId: { type: integer }
        name: { type: string, minLength: 1 }
        description: { type: string }
        sku: { type: string }
        price: { type: number }
        oldPrice: { type: ["number", "null"] }
        imageUrl: { type: string }
        stock: { type: integer }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        sizes:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        colors:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        sizeOrder: { $ref: "#/components/schemas/SizeOrder" }
    ProductUpdate:
      type: object
      properties:
        categoryId: { type: integer }
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        sku: { type: ["string", "null"] }
        price: { type: number }
        oldPrice: { type: ["number", "null"] }
        imageUrl: { type: ["string", "null"] }
        stock: { type: integer }
        isActive: { type: boolean }
        isFeatured: { type: boolean }
        sizes:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        colors:
          type: array
          items: { $ref: "#/components/schemas/ProductOption" }
        sizeOrder: { $ref: "#/components/schemas/SizeOrder" }
    OrderItem:
      type: object
      required: [productId, productName, price, quantity]
      properties:
        productId: { type: ["integer", "null"], description: "null when the product was deleted" }
        productName: { type: string }
        variant: { type: ["string", "null"], description: "Chosen size / colour" }
        price: { type: number }
        quantity: { type: integer }
        imageUrl: { type: ["string", "null"] }
    Order:
      type: object
      required: [id, customerName, phone, contactMethod, status, total, paymentMethod, paymentStatus, items, createdAt]
      properties:
        id: { type: integer }
        customerName: { type: string }
        lastName: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        middleName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: string }
        contactMethod: { type: string, description: "viber | telegram | whatsapp | phone" }
        comment: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        novaPoshtaBranch: { type: ["string", "null"] }
        status: { type: string, description: "new | confirmed | shipped | completed | cancelled" }
        total: { type: number }
        paymentMethod: { type: string, description: "liqpay | bank_transfer (cash on legacy orders)" }
        paymentStatus: { type: string, description: "pending | paid | failed" }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt: { type: string }
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        size: { type: string, description: "Name of one of the product's sizes" }
        color: { type: string, description: "Name of one of the product's colours" }
    OrderInput:
      type: object
      required: [lastName, firstName, phone, email, contactMethod, items]
      properties:
        lastName: { type: string, minLength: 1 }
        firstName: { type: string, minLength: 1 }
        middleName: { type: string }
        phone: { type: string, minLength: 5 }
        email: { type: string, format: email }
        contactMethod: { type: string, enum: [viber, telegram, whatsapp, phone] }
        comment: { type: string }
        city: { type: string }
        novaPoshtaBranch: { type: string }
        npCityRef: { type: string, description: "Nova Poshta city Ref" }
        npWarehouseRef: { type: string, description: "Nova Poshta warehouse Ref" }
        saveAsDefault: { type: boolean, description: "Signed-in buyer: store these contacts and address as defaults" }
        paymentMethod: { type: string, enum: [liqpay, bank_transfer], description: "Online card via LiqPay, or bank details sent by the manager" }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    OrderUpdate:
      type: object
      properties:
        status: { type: string }
        paymentStatus: { type: string }
    OrderPaymentStatus:
      type: object
      required: [orderId, paymentStatus, status]
      properties:
        orderId: { type: integer }
        paymentStatus: { type: string, description: "pending | paid | failed" }
        status: { type: string, description: "new | confirmed | shipped | completed | cancelled" }
    LiqpayWebhookPayload:
      type: object
      properties:
        data: { type: string }
        signature: { type: string }
    LiqpayCheckout:
      type: object
      required: [data, signature]
      properties:
        data: { type: string }
        signature: { type: string }
    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    AdminStats:
      type: object
      required: [totalProducts, activeProducts, lowStockProducts, totalOrders, newOrders, totalRevenue, ordersByStatus, recentOrders, topProducts]
      properties:
        totalProducts: { type: integer }
        activeProducts: { type: integer }
        lowStockProducts: { type: integer }
        totalOrders: { type: integer }
        newOrders: { type: integer }
        totalRevenue: { type: number }
        ordersByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
    AdminSession:
      type: object
      required: [authenticated, setupRequired, totpEnabled]
      properties:
        authenticated: { type: boolean }
        setupRequired: { type: boolean, description: "true when no admin password has been set yet" }
        totpEnabled: { type: boolean }
    AdminSetupInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
        totpCode: { type: string }
    AdminLoginResult:
      type: object
      required: [status]
      properties:
        status: { type: string, description: "ok | totp_required" }
    TotpSetup:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret: { type: string }
        otpauthUrl: { type: string }
    TotpCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6 }
    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
    TopProduct:
      type: object
      required: [productId, productName, unitsSold, revenue]
      properties:
        productId: { type: ["integer", "null"] }
        productName: { type: string }
        unitsSold: { type: integer }
        revenue: { type: number }
    SiteContacts:
      type: object
      required: [phone, viber, telegram, whatsapp, instagram, email, address, workHours]
      properties:
        phone: { type: string }
        viber: { type: string, description: "Phone number used for the Viber link" }
        whatsapp: { type: string, description: "Phone number used for the WhatsApp link" }
        telegram: { type: string, description: "Username or t.me link" }
        instagram: { type: string, description: "Username or link" }
        email: { type: string }
        address: { type: string }
        workHours: { type: string }
    SiteHero:
      type: object
      required: [eyebrow, title, titleAccent, subtitle]
      properties:
        eyebrow: { type: string }
        title: { type: string }
        titleAccent: { type: string }
        subtitle: { type: string }
    PromoCard:
      type: object
      required: [title, note, image, color, query]
      properties:
        title: { type: string }
        note: { type: string }
        image: { type: string }
        color: { type: string, description: "Header colour, #rrggbb" }
        query: { type: string, description: "Catalog search applied on click" }
    FaqItem:
      type: object
      required: [q, a]
      properties:
        q: { type: string }
        a: { type: string }
    SiteSettings:
      type: object
      required: [minOrderTotal, bannerTheme, contacts, hero, promos, faq]
      properties:
        minOrderTotal: { type: number, minimum: 0 }
        bannerTheme: { type: string, enum: [spring, newyear], description: "Seasonal look of the home page brand banner" }
        contacts: { $ref: "#/components/schemas/SiteContacts" }
        hero: { $ref: "#/components/schemas/SiteHero" }
        promos:
          type: array
          items: { $ref: "#/components/schemas/PromoCard" }
        faq:
          type: array
          items: { $ref: "#/components/schemas/FaqItem" }
    NpCity:
      type: object
      required: [ref, name, area]
      properties:
        ref: { type: string }
        name: { type: string }
        area: { type: string, description: "Oblast" }
    NpWarehouse:
      type: object
      required: [ref, number, name]
      properties:
        ref: { type: string }
        number: { type: string }
        name: { type: string }
    AuthConfig:
      type: object
      required: [email, google, telegramBot]
      properties:
        email: { type: boolean }
        google: { type: boolean }
        telegramBot: { type: ["string", "null"], description: "Bot username for the Telegram Login Widget" }
    OkResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    EmailLoginStart:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    EmailLoginVerify:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, minLength: 6, maxLength: 6 }
    TelegramAuthInput:
      type: object
      required: [id, auth_date, hash]
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        username: { type: string }
        photo_url: { type: string }
        auth_date: { type: integer }
        hash: { type: string }
    Customer:
      type: object
      required: [id, email, lastName, firstName, middleName, phone, contactMethod, hasGoogle, hasTelegram]
      properties:
        id: { type: integer }
        email: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        middleName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        contactMethod: { type: ["string", "null"] }
        hasGoogle: { type: boolean }
        hasTelegram: { type: boolean }
    CustomerUpdate:
      type: object
      properties:
        lastName: { type: string }
        firstName: { type: string }
        middleName: { type: string }
        phone: { type: string }
        contactMethod: { type: string, enum: [viber, telegram, whatsapp, phone] }
    Address:
      type: object
      required: [id, city, npCityRef, branch, npWarehouseRef, isDefault]
      properties:
        id: { type: integer }
        city: { type: string }
        npCityRef: { type: string }
        branch: { type: string }
        npWarehouseRef: { type: string }
        isDefault: { type: boolean }
    AddressInput:
      type: object
      required: [city, npCityRef, branch, npWarehouseRef]
      properties:
        city: { type: string, minLength: 1 }
        npCityRef: { type: string, minLength: 1 }
        branch: { type: string, minLength: 1 }
        npWarehouseRef: { type: string, minLength: 1 }
        isDefault: { type: boolean }
    Me:
      type: object
      required: [customer, defaultAddress]
      properties:
        customer:
          oneOf:
            - { $ref: "#/components/schemas/Customer" }
            - { type: "null" }
        defaultAddress:
          oneOf:
            - { $ref: "#/components/schemas/Address" }
            - { type: "null" }
    ViewedInput:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          maxItems: 50
          items: { type: integer }
    ImageUpload:
      type: object
      required: [dataUrl]
      properties:
        dataUrl: { type: string, description: "data:image/(png|jpeg|webp|gif);base64,..." }
    ImageUploadResult:
      type: object
      required: [url]
      properties:
        url: { type: string }
